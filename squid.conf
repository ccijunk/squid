# Minimal Squid v7.7.1 proxy configuration for the container image.
# Override by mounting your own config to /etc/squid/squid.conf.
#
# Note: `localhost` and `to_localhost` ACLs are built into Squid 7.x,
# so they are not (re)defined here.

# ---- listener ----
http_port 3128

# pid file inside the squid-owned state directory (container runs as uid 3128)
pid_filename /var/run/squid/squid.pid

# ---- cache ----
cache_mem 64 MB
cache_dir ufs /var/cache/squid 100 16 256
coredump_dir /var/cache/squid

# ---- logging ----
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log

# ---- access control ----
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

http_access allow localnet
http_access allow localhost
http_access deny all
